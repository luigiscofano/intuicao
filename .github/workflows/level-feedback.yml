name: Feedback de níveis
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  feedback:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
      - run: node --test tests/level-feedback.test.mjs tests/level-next-action.test.mjs tests/contextual-result-motion.test.mjs tests/motion-preference.test.mjs
