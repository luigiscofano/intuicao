name: Motores — recorte explícito
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  engines:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Verificar cinco motores (não é a suíte completa)
        run: node --test tests/broto-engine.test.mjs tests/cerco-engine.test.mjs tests/sintonia-engine.test.mjs tests/repasse-engine.test.mjs tests/orbita-engine.test.mjs
      - name: Verificar família lógica e integração com a plataforma
        run: node --test tests/logica/*.test.mjs tests/approved-opening.test.mjs tests/approved-game-shell.test.mjs tests/contextual-guidance.test.mjs tests/library-navigation.test.mjs tests/achievements*.test.mjs tests/desvio-options-ui.test.mjs tests/progress-backup.test.mjs tests/identity.test.mjs tests/ui-motion.test.mjs tests/victory-tiles.test.mjs tests/motion-preference.test.mjs tests/versus-victory-approved.test.mjs tests/board-fit.test.mjs tests/campaign-action-buttons.test.mjs tests/rules-preview.test.mjs tests/rules-logic-examples.test.mjs tests/rules-versus-examples.test.mjs tests/rules-scope.test.mjs tests/rules-copy-preservation.test.mjs tests/original-daily.test.mjs tests/selection-presentation.test.mjs tests/presentation-scope.test.mjs tests/campaign-progress-display.test.mjs tests/campaign-progress-scope.test.mjs

      - name: Verificar oito duelos, histórico, busca e backup
        run: node --test tests/versus/*.test.mjs

      - name: Conferir índice das missões específicas
        run: node scripts/build-achievement-index.mjs --check

