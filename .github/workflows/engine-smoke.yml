name: Motores — recorte explícito
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  engines:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Verificar cinco motores (não é a suíte completa)
        run: node --test tests/broto-engine.test.mjs tests/cerco-engine.test.mjs tests/sintonia-engine.test.mjs tests/repasse-engine.test.mjs tests/orbita-engine.test.mjs
      - name: Verificar família lógica e integração com a plataforma
        run: node --test tests/logica/*.test.mjs tests/approved-opening.test.mjs tests/approved-game-shell.test.mjs tests/campaign-level-names.test.mjs tests/contextual-guidance.test.mjs tests/library-navigation.test.mjs tests/achievements*.test.mjs tests/desvio-options-ui.test.mjs tests/progress-backup.test.mjs tests/identity.test.mjs tests/ui-motion.test.mjs tests/victory-tiles.test.mjs tests/motion-preference.test.mjs tests/versus-victory-approved.test.mjs tests/board-fit.test.mjs tests/campaign-action-buttons.test.mjs tests/rules-preview.test.mjs tests/rules-logic-examples.test.mjs tests/rules-versus-examples.test.mjs tests/rules-scope.test.mjs tests/rules-copy-preservation.test.mjs tests/original-daily.test.mjs tests/selection-presentation.test.mjs tests/level-completion-state.test.mjs tests/presentation-scope.test.mjs tests/campaign-progress-display.test.mjs tests/campaign-progress-scope.test.mjs tests/transparent-tiles.test.mjs tests/foz-visual-approved.test.mjs tests/game-viewport.test.mjs tests/selection-level-notice.test.mjs tests/game-viewport-scope.test.mjs tests/viewport-fixture-security.test.mjs tests/renovo-scope.test.mjs tests/mirante-scope.test.mjs

      - name: Verificar navegação lateral das quatorze campanhas
        run: node --test tests/level-arrows*.test.mjs tests/retired-games.test.mjs tests/game-catalog-indices.test.mjs tests/cohesion-contract.test.mjs

      - name: Verificar oito duelos, histórico, busca e backup
        run: node --test tests/versus/*.test.mjs tests/versus-player-layout.test.mjs

      - name: Verificar expansão dos mapas e seleção comum dos duelos
        run: node --test tests/maps-expansion*.test.mjs

      - name: Verificar estados condicionais do viewport
        run: node tests/viewport-conditional-states.mjs

      - name: Verificar diálogo Sobre sem comemoração demonstrativa
        run: node --test tests/about-dialog-current.test.mjs

      - name: Conferir índice das missões específicas
        run: node scripts/build-achievement-index.mjs --check

