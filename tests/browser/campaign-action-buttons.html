<!doctype html>
<html lang="pt-BR">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>QA · botões de campanha</title>
  <style>
    body { margin: 0; background: #e7e4da; font: 14px system-ui; }
    nav { padding: 10px; display: flex; gap: 8px; position: sticky; top: 0; background: white; z-index: 5; flex-wrap: wrap; }
    button, select { padding: 8px; }
    iframe { display: block; border: 0; margin: 12px auto; background: white; }
    pre { white-space: pre-wrap; padding: 16px; background: white; }
  </style>
  <nav aria-label="Controles de teste">
    <select id="game" aria-label="Jogo"></select>
    <button id="open">Abrir primeiro nível</button>
    <button data-w="320" data-h="568">320 × 568</button>
    <button data-w="360" data-h="640">360 × 640</button>
    <button data-w="390" data-h="844">390 × 844</button>
    <button data-w="1024" data-h="768">1024 × 768</button>
    <button id="run">Testar 14 jogos em 4 telas</button>
  </nav>
  <iframe title="Jogo em teste" src="../../dist/index.html" width="360" height="640"></iframe>
  <pre id="results">Pronto</pre>
  <script type="module" src="campaign-action-buttons.mjs"></script>
</html>
