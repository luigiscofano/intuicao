<!doctype html><meta charset="utf-8"><title>Viewport QA</title><style>body{font:14px system-ui;margin:8px}iframe{border:1px solid;display:block;margin-top:10px}pre{white-space:pre-wrap;max-height:220px;overflow:auto}</style><button id="run">Run viewport matrix</button><select id="mode"><option>first</option><option>last</option><option>daily</option><option>endless</option></select><input id="games" placeholder="All games"><pre id="results">Ready</pre><iframe id="frame"></iframe><script type="module">
const games='light cut elo prumo pacto sintonia repasse orbita divisa pulso foz refugio mirante renovo desvio broto cerco enlace vazante mosaico quinhao estalo dobra acorde lastro'.split(' ');
const params=new URL(location.href).searchParams;const sizes=params.has('sizes')?params.get('sizes').split(',').map(s=>s.split('x').map(Number)):[[1440,900],[1180,757],[768,1024],[390,844],[320,568],[844,390]];document.getElementById('games').value=params.get('games')||'';
const frame=document.getElementById('frame'),out=document.getElementById('results');
const wait=ms=>new Promise(r=>setTimeout(r,ms));
const visible=e=>e&&!e.closest('[hidden]')&&e.getClientRects().length&&!e.parentElement?.closest('details:not([open])');
async function until(fn){for(let i=0;i<80;i++){const r=fn();if(r)return r;await wait(60);}throw Error('timeout');}
function measure(game,size,mode){const d=frame.contentDocument,w=frame.contentWindow,s=[...d.querySelectorAll('.viewport-game')].find(visible);if(!s)throw Error('no viewport section');const parts=[...s.querySelectorAll('.approved-game-heading,.approved-play-surface,.approved-action-panel')].filter(visible),rects=parts.map(e=>e.getBoundingClientRect());const top=Math.min(...rects.map(r=>r.top)),bottom=Math.max(...rects.map(r=>r.bottom));const off=parts.flatMap(p=>[...p.querySelectorAll('button,summary,select')]).filter(visible).filter(e=>!e.closest('.viewport-board-scroll')).map(e=>({name:e.getAttribute('aria-label')||e.textContent.trim(),rect:e.getBoundingClientRect()})).filter(e=>e.rect.top< -1||e.rect.bottom>w.innerHeight+1||e.rect.left< -1||e.rect.right>w.innerWidth+1).map(e=>({name:e.name,top:Math.round(e.rect.top),bottom:Math.round(e.rect.bottom),left:Math.round(e.rect.left),right:Math.round(e.rect.right)}));return{game,size,mode,fit:s.dataset.viewportFit,top:Math.round(top),bottom:Math.round(bottom),height:Math.round(bottom-top),off,overflow:d.documentElement.scrollWidth>w.innerWidth+1};}
document.getElementById('run').onclick=async()=>{
 const reports=[];const selected=['estalo','dobra','quinhao','acorde','lastro'];
 const settle=async()=>{await new Promise(r=>frame.contentWindow.requestAnimationFrame(()=>frame.contentWindow.requestAnimationFrame(r)));await wait(200);};
 const inspect=async(game,state)=>{for(const size of [[320,568],[390,844],[844,390]]){frame.width=size[0];frame.height=size[1];await settle();reports.push({...measure(game,size,'conditional'),state});out.textContent=JSON.stringify({done:false,count:reports.length,reports},null,2);}};
 for(const game of selected){try{
  frame.width=390;frame.height=844;frame.src=`index.html?game=${encodeURIComponent(game)}`;await new Promise(r=>frame.onload=r);const d=frame.contentDocument;
  const start=await until(()=>d.querySelector('#nv-start'));const mode=d.querySelector('#nv-mode');mode.value='local';mode.dispatchEvent(new Event('change',{bubbles:true}));start.click();await wait(100);d.querySelector('dialog[open] [data-dialog-confirm]')?.click();
  await until(()=>[...d.querySelectorAll('.viewport-game')].find(visible));await settle();
  const click=async(selector)=>{const e=await until(()=>[...d.querySelectorAll(selector)].find(e=>visible(e)&&!e.disabled));e.click();await settle();};
  const action=async(fn)=>{const e=await until(()=>[...d.querySelectorAll('[data-action]')].find(e=>visible(e)&&!e.disabled&&fn(JSON.parse(e.dataset.action))));e.click();await settle();};
  if(game==='estalo'){await click('.estalo-cell:not(:disabled)');await inspect(game,'aim');await click('.estalo-aim-button');await inspect(game,'preview');}
  if(game==='dobra'){await click('.dobra-tile:not(:disabled)');await inspect(game,'edge');await click('.dobra-edge:not(:disabled)');await inspect(game,'preview');}
  if(game==='quinhao'){await click('.quinhao-basket:not(:disabled)');await inspect(game,'offer');await click('#nv-confirm');await inspect(game,'choices');await click('.quinhao-choice');await inspect(game,'receipt');}
  if(game==='acorde'){for(const n of [4,0,1,5,6,2,3,7]){await action(a=>a.type==='cell'&&a.cell===n);await click('#nv-confirm');}await inspect(game,'pass');await click('.acorde-pass');await inspect(game,'pass-preview');}
  if(game==='lastro'){const moves=[['E1',2],['E1',3],['E1',4],['D2',2],['E2',2],['D2',3],['E2',3],['D2',4],['E2',4],['D3',2],['D3',3],['E7',2],['D3',4],['D5',2],['E7',3],['D5',3]];for(const [piece,to]of moves){await click(`.lastro-rail[data-piece="${piece}"] .lastro-mark--occupied:not(:disabled)`);await action(a=>a.type==='destination'&&a.piece===piece&&a.to===to);if(piece==='E1'&&to===2)await inspect(game,'destination-preview');await click('#nv-confirm');}await inspect(game,'round-break');await click('.lastro-next-round');await inspect(game,'next-round-preview');}
 }catch(e){reports.push({game,error:e.message});}}
 out.textContent=JSON.stringify({done:true,count:reports.length,reports},null,2);
};</script>
