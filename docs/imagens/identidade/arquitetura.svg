<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 510" width="1000" height="510"><title>Arquitetura modular e fronteiras de responsabilidade</title><rect width="1000" height="510" fill="#fff"/><g stroke="#525b62" stroke-width="1.5" fill="none"><path d="M300 125H350M610 125H660M790 165V225M480 165V225M170 165V225M480 305V365"/></g><g font-family="Arial,sans-serif" fill="#252b30"><text x="40" y="40" font-size="24">INTUIÇÃO / ARQUITETURA MODULAR</text><rect x="40" y="85" width="260" height="80" fill="#f5f6f6" stroke="#657077"/><text x="56" y="131" font-size="20">Navegação / catálogo</text><rect x="350" y="85" width="260" height="80" fill="#f5f6f6" stroke="#657077"/><text x="366" y="131" font-size="20">Sessão / ações</text><rect x="660" y="85" width="260" height="80" fill="#f5f6f6" stroke="#657077"/><text x="676" y="131" font-size="20">Motor / regras</text><rect x="40" y="225" width="260" height="80" fill="#f5f6f6" stroke="#657077"/><text x="56" y="271" font-size="20">View / controles</text><rect x="350" y="225" width="260" height="80" fill="#f5f6f6" stroke="#657077"/><text x="366" y="271" font-size="20">Histórico / progresso</text><rect x="660" y="225" width="260" height="80" fill="#f5f6f6" stroke="#657077"/><text x="676" y="271" font-size="20">Busca em Worker</text><rect x="350" y="365" width="260" height="80" fill="#f5f6f6" stroke="#657077"/><text x="366" y="411" font-size="20">Backup validado</text><text x="40" y="485" font-size="16">Mapa conceitual: cada família mantém seus adaptadores. Não é um grafo completo de imports.</text></g></svg>
