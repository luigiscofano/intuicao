<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" role="img" aria-labelledby="t d"><title id="t">Arquitetura conceitual do Intuição</title><desc id="d">Navegação liga conteúdo e interfaces aos motores. Motores produzem resultados apresentados pela interface e preservados localmente. Ferramentas offline e testes ficam fora da partida.</desc><rect width="1000" height="420" fill="#fffaf0"/><g font-family="Arial,sans-serif" text-anchor="middle"><text x="500" y="40" fill="#30412f" font-size="24" font-weight="bold">Regras separadas da apresentação</text><g fill="#244b63"><rect x="35" y="90" width="220" height="80" rx="8"/><rect x="390" y="90" width="220" height="80" rx="8"/><rect x="745" y="90" width="220" height="80" rx="8"/></g><g fill="white" font-size="19"><text x="145" y="124">Catálogo e navegação</text><text x="145" y="150" font-size="14">IDs · rotas · campanhas</text><text x="500" y="124">Interface + motor</text><text x="500" y="150" font-size="14">ação → validação → estado</text><text x="855" y="124">Apresentação</text><text x="855" y="150" font-size="14">SVG · CSS · movimento</text></g><g stroke="#cca034" stroke-width="5" fill="none"><path d="M260 130H380m-12-10 12 10-12 10M615 130H735m-12-10 12 10-12 10M500 180V230m-10-12 10 12 10-12"/></g><rect x="350" y="240" width="300" height="65" rx="8" fill="#39654c"/><text x="500" y="268" fill="white" font-size="18">Progresso e backup local</text><text x="500" y="290" fill="white" font-size="14">versões · tentativas · conquistas</text><path d="M35 335H965" stroke="#d4d2c2"/><text x="500" y="365" fill="#30412f" font-size="18">Fora da partida: geração, auditoria, testes e documentação</text><text x="500" y="395" fill="#596557" font-size="14">Diagrama de responsabilidades, não uma captura da interface</text></g></svg>
