<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="280" viewBox="0 0 1000 280" role="img"><title>REFÚGIO: uma barreira toca duas regiões diferentes</title><rect width="1000" height="280" fill="#fff"/><g font-family="Arial,sans-serif" fill="#24302c"><text x="30" y="40" font-size="24">REFÚGIO · contato pelos lados, não pelas diagonais</text><rect x="100" y="85" width="180" height="85" fill="#e8efe7" stroke="#39654c"/><rect x="280" y="85" width="85" height="85" fill="#5b6262"/><rect x="365" y="85" width="180" height="85" fill="#e5ebf1" stroke="#244b63"/><text x="130" y="137" font-size="20">Refúgio A</text><text x="390" y="137" font-size="20">Refúgio B</text><text x="100" y="220" font-size="20">A casa de barreira toca A e B: dois refúgios distintos.</text><text x="100" y="250" font-size="18">Tocar o mesmo refúgio em dois lados continua contando como um só.</text></g></svg>
