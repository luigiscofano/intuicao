<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="280" viewBox="0 0 1000 280" role="img"><title>PULSO: três batidas com intervalos iguais</title><rect width="1000" height="280" fill="#fff"/><g font-family="Arial,sans-serif" fill="#24302c"><text x="30" y="40" font-size="24">PULSO · exemplo ilustrativo, não uma fase completa</text><rect x="80" y="80" width="90" height="80" fill="#244b63" stroke="#34463c"/><text x="115" y="195" font-size="20">1</text><rect x="210" y="80" width="90" height="80" fill="#f4f5ec" stroke="#34463c"/><text x="245" y="195" font-size="20">2</text><rect x="340" y="80" width="90" height="80" fill="#244b63" stroke="#34463c"/><text x="375" y="195" font-size="20">3</text><rect x="470" y="80" width="90" height="80" fill="#f4f5ec" stroke="#34463c"/><text x="505" y="195" font-size="20">4</text><rect x="600" y="80" width="90" height="80" fill="#244b63" stroke="#34463c"/><text x="635" y="195" font-size="20">5</text><text x="80" y="242" font-size="20">1 → 3 = dois passos. 3 → 5 = dois passos. As colunas também têm cotas.</text></g></svg>
