<title id="gallery-title">REFÚGIO — fase 1, estado inicial</title>
<desc id="gallery-desc">Fase 1 · Duas margens 01 · Básico. Separe os marcos em espaços livres, usando apenas barreiras que realmente separam dois refúgios. Estado inicial real do catálogo, com pistas e coordenadas preservadas.</desc>
